<body>
<main class="phone">

  <header class="pagehead rise" style="padding-bottom:6px">
    <div>
      <h1 class="disp">Хэрэглэгчид</h1>
      <div class="muted" style="font-size:13px;margin-top:3px" id="subline"></div>
    </div>
  </header>

  <section class="rise d1 mx" style="margin-top:10px;border-radius:26px;background:#0F3B57;color:#fff;padding:18px 18px 16px;position:relative;overflow:hidden">
    <div style="position:absolute;left:0;right:0;bottom:0;height:56px;overflow:hidden;pointer-events:none">
      <svg class="run-slow" viewBox="0 0 800 56" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:200%;height:56px" aria-hidden="true"><path d="M0 26 Q50 14 100 26 T200 26 T300 26 T400 26 T500 26 T600 26 T700 26 T800 26 V56 H0 Z" fill="#12445F"/></svg>
    </div>
    <div style="position:relative">
      <div style="font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#7CC6E8">Нийт авлага (өр)</div>
      <div class="hero-fig" id="totalDebt" style="font-size:38px;margin-top:6px"></div>
      <div style="font-size:13px;color:#BFDDEB;margin-top:6px" id="debtorsLine"></div>
      <div class="grid3" style="margin-top:16px;gap:8px">
        <div style="padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08)"><div style="font-size:18px;font-weight:600" id="sAll"></div><div style="font-size:11.5px;color:#BFDDEB;margin-top:2px">Бүгд</div></div>
        <div style="padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08)"><div style="font-size:18px;font-weight:600" id="sActive"></div><div style="font-size:11.5px;color:#BFDDEB;margin-top:2px">30 хоногт</div></div>
        <div style="padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08)"><div style="font-size:18px;font-weight:600" id="sNew"></div><div style="font-size:11.5px;color:#BFDDEB;margin-top:2px">Энэ сар шинэ</div></div>
      </div>
    </div>
  </section>

  <div class="rise d2 mx" style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input class="inp" id="q" type="search" placeholder="Нэр, утас эсвэл баг" aria-label="Хэрэглэгч хайх">
    </div>
    <div class="segbox white" id="sortSeg">
      <div class="pill"></div>
      <button class="seg on" data-s="debt">Өртэй</button>
      <button class="seg" data-s="top">Их авдаг</button>
      <button class="seg" data-s="recent">Сүүлд</button>
    </div>
  </div>

  <section class="card mx fade-swap" id="list" style="margin-top:12px;padding:0 16px"></section>
  <div class="mx" style="text-align:center;margin-top:8px"><button class="linkbtn" id="more" hidden>Цааш үзэх</button></div>
</main>

<nav class="tb glass five" data-liquid aria-label="Admin цэс">
  <div class="goo"><div class="blob trail"></div><div class="blob lead"></div></div>
  <a href="admin.html" class="tab" data-nav><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 9.5h16M8.5 3.5v3M15.5 3.5v3"/></svg>Өнөөдөр</a>
  <a href="#" class="tab" data-nav data-soon="Бүх захиалгын жагсаалт загварт хараахан ороогүй"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4" width="15" height="16.5" rx="3"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg>Захиалга</a>
  <a href="admin-customers.html" class="tab cur" data-nav><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.3"/><path d="M3 19.5c.9-3 3.2-4.6 6-4.6s5.1 1.6 6 4.6"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6M17.5 14.9c1.8.5 3 1.9 3.5 4.6"/></svg>Хэрэглэгч</a>
  <a href="admin-tx.html" class="tab" data-nav><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12h6"/></svg>Гүйлгээ</a>
  <a href="#" class="tab" data-nav data-soon="Тохиргоо загварт хараахан ороогүй"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Тохиргоо</a>
</nav>

<script src="assets/app.js"></script>
<script src="assets/data.js"></script>
<script src="assets/admin-report.js"></script>
<script>
(function () {
  const K = KHISHIG;
  const D = K.data;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PAGE = 25;
  const st = { sort: 'debt', q: '', limit: PAGE };

  const debtors = D.customers.filter((c) => c.debt > 0);
  const monthStart = Math.round((Date.UTC(2026, 8, 1) - D.START) / D.DAY);
  $('totalDebt').textContent = K.fmt(debtors.reduce((a, c) => a + c.debt, 0));
  $('debtorsLine').textContent = debtors.length + ' хэрэглэгч өртэй';
  $('sAll').textContent = D.customers.length;
  $('sActive').textContent = D.customers.filter((c) => c.last >= D.LAST - 30).length;
  $('sNew').textContent = D.customers.filter((c) => c.created >= monthStart).length;
  $('subline').textContent = 'Арвайхээр · ' + D.customers.length + ' хэрэглэгч';

  function rows() {
    const q = st.q.trim().toLowerCase();
    let list = D.customers.filter((c) => !q || c.name.toLowerCase().includes(q) || c.phone.includes(q) || (c.bag + '-р баг').includes(q));
    if (st.sort === 'debt') list = list.filter((c) => c.debt > 0).sort((a, b) => b.debt - a.debt);
    else if (st.sort === 'top') list = list.slice().sort((a, b) => b.bottles - a.bottles);
    else list = list.slice().sort((a, b) => b.last - a.last);
    return list;
  }

  function render() {
    const list = rows();
    $('list').innerHTML = list.slice(0, st.limit).map((c) => {
      let right;
      if (st.sort === 'debt') right = '<span class="debtbadge">' + K.fmt(c.debt) + '</span>';
      else if (st.sort === 'top') right = '<div style="text-align:right"><div style="font-weight:700;font-variant-numeric:tabular-nums">' + c.bottles + '</div><div class="muted" style="font-size:12px">баллон</div></div>';
      else right = '<div class="muted" style="font-size:12.5px;text-align:right;white-space:nowrap">' + (c.last >= 0 ? D.ago(c.last) : '—') + '</div>';
      return '<a class="custrow" href="admin-customer.html?id=' + c.id + '">' +
        '<div class="avatar" style="' + K.avatarStyle(c.id) + '">' + esc(D.initials(c.name)) + '</div>' +
        '<div style="flex:1;min-width:0"><div class="cname">' + esc(c.name) + '</div>' +
        '<div class="muted" style="font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + c.phone + ' · ' + c.bag + '-р баг · ' + c.orders + ' захиалга</div></div>' +
        right + '</a>';
    }).join('') || '<div class="muted" style="text-align:center;padding:30px 0;font-size:14px">Хэрэглэгч олдсонгүй</div>';
    $('more').hidden = list.length <= st.limit;
  }

  const placeSort = K.seg($('sortSeg'));
  document.querySelectorAll('#sortSeg .seg').forEach((b) => b.addEventListener('click', () => {
    st.sort = b.dataset.s;
    st.limit = PAGE;
    document.querySelectorAll('#sortSeg .seg').forEach((x) => x.classList.toggle('on', x === b));
    placeSort();
    render();
  }));
  let qt;
  $('q').addEventListener('input', (e) => {
    clearTimeout(qt);
    $('list').classList.add('dim');
    qt = setTimeout(() => { st.q = e.target.value; st.limit = PAGE; render(); $('list').classList.remove('dim'); }, 180);
  });
  $('more').addEventListener('click', () => { st.limit += PAGE; render(); });
  render();
})();
</script>
</body>
</html>
