<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EEEB">
<title>Хишиг ус · Захиалах</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%277%27 fill=%27%230F3B57%27/%3E%3Cpath d=%27M12 4.5c3 3.6 5 6.4 5 8.9a5 5 0 0 1-10 0c0-2.5 2-5.3 5-8.9z%27 fill=%27%237CC6E8%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="phone with-bar">

  <header class="pagehead rise">
    <a href="home.html" class="iconbtn" aria-label="Буцах"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 class="disp">Захиалга</h1>
  </header>

  <div class="sec rise d1">Хэдэн баллон?</div>
  <section class="card rise d1 mx" style="padding:18px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:15px;font-weight:600">5л баллонтой ус</div>
        <div class="muted" style="font-size:13px;margin-top:3px"><span data-price></span> / ширхэг</div>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="step" id="dec" aria-label="Хасах"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
        <div class="qty-num disp" id="qty" aria-live="polite">2</div>
        <button class="step" id="inc" aria-label="Нэмэх"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>
    <div class="bottles" id="bottles" aria-hidden="true"></div>
    <div id="bonus"></div>
  </section>

  <div class="sec rise d2">Холбоо барих</div>
  <section class="card rise d2 mx" style="padding:18px;display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="name">Нэр</label><input id="name" class="inp" value="Батбаяр" autocomplete="name" placeholder="Таны нэр"></div>
    <div class="field">
      <label for="phone">Утасны дугаар</label>
      <input id="phone" class="inp" value="99112233" inputmode="numeric" autocomplete="tel" placeholder="8 оронтой дугаар">
      <div class="err" id="phoneErr" hidden>8 оронтой утасны дугаар оруулна уу</div>
    </div>
  </section>

  <div class="sec rise d3">Хүргэх хаяг</div>
  <section class="card rise d3 mx" style="padding:18px;display:flex;flex-direction:column;gap:14px">
    <div class="field">
      <label for="bag">Баг</label>
      <div class="selwrap">
        <select id="bag" class="inp">
          <option value="1">1-р баг</option><option value="2">2-р баг</option><option value="3">3-р баг</option>
          <option value="4">4-р баг</option><option value="5" selected>5-р баг</option><option value="6">6-р баг</option>
          <option value="7">7-р баг</option><option value="8">8-р баг</option><option value="9">9-р баг</option>
          <option value="10">10-р баг</option>
        </select>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label for="street">Байр / гудамж</label><input id="street" class="inp" value="12-р байр" placeholder="12-р байр"></div>
      <div class="field"><label for="unit">Тоот / хашаа</label><input id="unit" class="inp" value="34 тоот" placeholder="34 тоот"></div>
    </div>
    <div class="field"><label for="note">Нэмэлт тайлбар</label><textarea id="note" class="inp" placeholder="Орц, код, ойролцоох тэмдэг…"></textarea></div>
  </section>

  <div class="sec rise d4">Хүргэлтийн цаг</div>
  <section class="card rise d4 mx" style="padding:18px;display:flex;flex-direction:column;gap:12px">
    <div class="segbox" id="daySeg">
      <div class="pill"></div>
      <button class="seg on" data-day="today">Өнөөдөр</button>
      <button class="seg" data-day="tomorrow">Маргааш</button>
    </div>
    <div class="grid2" id="slots">
      <button class="slot" data-slot="asap"><b>Аль болох хурдан</b><span>Дараалалд орно</span></button>
      <button class="slot" data-slot="09-12"><b>09:00–12:00</b><span></span></button>
      <button class="slot" data-slot="12-15"><b>12:00–15:00</b><span></span></button>
      <button class="slot" data-slot="15-17"><b>15:00–17:00</b><span></span></button>
    </div>
  </section>

  <section class="card rise d4 mx" style="margin-top:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px">
    <div class="info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5"/></svg><span><b>Хоосон баллоноо бэлдээрэй.</b> Хүргэхдээ хуучин баллоныг тань аваад дүүрэнээр солино.</span></div>
    <div class="info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.5" width="18" height="11" rx="2.5"/><circle cx="12" cy="12" r="2.6"/></svg><span>Төлбөрөө хүргэлтээр — бэлнээр эсвэл дансаар.</span></div>
  </section>
</main>

<div class="bottombar glass milk">
  <div style="min-width:0">
    <div class="muted" style="font-size:12px;font-weight:600">Нийт</div>
    <div class="disp" id="total" style="font-size:22px;font-weight:600;margin-top:2px"></div>
    <div class="muted" id="breakdown" style="font-size:11.5px;margin-top:3px"></div>
  </div>
  <button class="wbtn" id="submit" style="height:56px;padding:0 26px;border-radius:18px;font-size:16px;flex-shrink:0">Захиалах</button>
</div>

<div id="done" hidden></div>

<script src="assets/app.js"></script>
<script>
(function () {
  const K = KHISHIG;
  const $ = (id) => document.getElementById(id);
  const q0 = parseInt(new URLSearchParams(location.search).get('qty'), 10);
  const st = { qty: q0 >= 1 && q0 <= 20 ? q0 : 2, day: 'today', slot: '12-15', touched: false };
  // Prototype clock: pretend it is 12:40 so the morning slot shows as past.
  const PAST_TODAY = ['09-12'];
  const LABEL = { asap: 'Аль болох хурдан', '09-12': '09:00–12:00', '12-15': '12:00–15:00', '15-17': '15:00–17:00' };

  const placeDay = K.seg($('daySeg'));

  function phoneOk() { return /^[6-9]\d{7}$/.test($('phone').value); }
  function nameOk() { return $('name').value.trim().length > 0; }

  function renderBottles(q, free) {
    const box = $('bottles');
    const want = q + free;
    while (box.children.length > want) box.lastChild.remove();
    while (box.children.length < want) {
      box.insertAdjacentHTML('beforeend', '<span class="bt"><svg width="16" height="24" viewBox="0 0 16 24"><path d="M6 1h4v3c0 1 4 1.6 4 5v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9c0-3.4 4-4 4-5z"/></svg></span>');
    }
    Array.from(box.children).forEach((el, i) => el.classList.toggle('free', i >= q));
  }

  let lastBonusKey = '';
  function renderBonus(q, free) {
    const key = free > 0 ? 'got' + free + '-' + q : (q % 3 === 2 ? 'nudge' : 'hint');
    if (key === lastBonusKey) return;
    lastBonusKey = key;
    let html;
    if (free > 0) {
      html = '<div class="bonus-box got"><span class="disp">+' + free + '</span>' + q + ' + ' + free + ' бэлэг = ' + (q + free) + ' баллон</div>';
    } else if (q % 3 === 2) {
      html = '<div class="bonus-box nudge">Дахиад 1 нэмбэл 1 баллон үнэгүй<button type="button" id="nudgeAdd">+1 нэмэх</button></div>';
    } else {
      html = '<div class="bonus-box hint">3 авбал 1 баллон бэлэг</div>';
    }
    $('bonus').innerHTML = html;
    const add = $('nudgeAdd');
    if (add) add.addEventListener('click', () => setQty(st.qty + 1));
  }

  function renderSlots() {
    const today = st.day === 'today';
    document.querySelectorAll('#slots .slot').forEach((b) => {
      const id = b.dataset.slot;
      const past = today && PAST_TODAY.includes(id);
      b.hidden = id === 'asap' && !today;
      b.disabled = past;
      b.classList.toggle('on', !past && id === st.slot);
      if (id !== 'asap') b.querySelector('span').textContent = past ? 'Өнгөрсөн' : (today ? 'Өнөөдөр' : 'Маргааш');
    });
  }

  function render() {
    const q = st.qty;
    const free = K.bonus(q);
    $('qty').textContent = q;
    $('dec').disabled = q <= 1;
    $('inc').disabled = q >= 20;
    renderBottles(q, free);
    renderBonus(q, free);
    renderSlots();
    $('total').textContent = K.fmt(q * K.price + K.fee);
    $('breakdown').textContent = q + ' × ' + K.fmt(K.price) + (K.fee ? ' · хүргэлт ' + K.fmt(K.fee) : ' · хүргэлт үнэгүй');
    const bad = st.touched && !phoneOk();
    $('phone').classList.toggle('bad', bad);
    $('phoneErr').hidden = !bad;
    $('submit').disabled = !(phoneOk() && nameOk());
  }

  function setQty(n) {
    const next = Math.max(1, Math.min(20, n));
    if (next === st.qty) return;
    st.qty = next;
    K.bump($('qty'));
    render();
  }

  $('dec').addEventListener('click', () => setQty(st.qty - 1));
  $('inc').addEventListener('click', () => setQty(st.qty + 1));
  $('phone').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
    st.touched = true;
    render();
  });
  $('name').addEventListener('input', render);

  document.querySelectorAll('#daySeg .seg').forEach((b) => b.addEventListener('click', () => {
    st.day = b.dataset.day;
    document.querySelectorAll('#daySeg .seg').forEach((x) => x.classList.toggle('on', x === b));
    placeDay();
    if (st.day === 'tomorrow' && st.slot === 'asap') st.slot = '09-12';
    if (st.day === 'today' && PAST_TODAY.includes(st.slot)) st.slot = '12-15';
    renderSlots();
  }));
  document.querySelectorAll('#slots .slot').forEach((b) => b.addEventListener('click', () => {
    if (b.disabled) return;
    st.slot = b.dataset.slot;
    renderSlots();
  }));

  $('submit').addEventListener('click', () => {
    st.touched = true;
    if (!(phoneOk() && nameOk())) { render(); return; }
    const when = st.slot === 'asap' ? 'Аль болох хурдан' : (st.day === 'today' ? 'Өнөөдөр, ' : 'Маргааш, ') + LABEL[st.slot];
    const done = $('done');
    done.innerHTML =
      '<div class="veil light" role="dialog" aria-modal="true" aria-label="Захиалга хүлээж авлаа">' +
        '<div class="card done-card">' +
          '<div style="width:104px;height:156px;position:relative">' +
            '<div data-bottle="fill" style="width:100%;height:100%"></div>' +
            '<div class="okbadge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
          '</div>' +
          '<h2 class="disp" style="margin:8px 0 0;font-size:21px;font-weight:600">Захиалга хүлээж авлаа</h2>' +
          '<p class="muted" style="margin:0;font-size:14px;line-height:1.55">#1043 · ' + when + '<br>Хоосон баллоноо бэлдэж байгаарай.</p>' +
          '<a href="status.html?s=new" class="wbtn" style="display:flex;width:100%;height:54px;border-radius:18px;font-size:15px;margin-top:6px">Захиалгаа харах</a>' +
          '<button type="button" id="closeDone" style="border:0;background:transparent;color:#16679A;font-size:14px;font-weight:600;padding:10px">Хаах</button>' +
        '</div>' +
      '</div>';
    done.hidden = false;
    K.enhance(done);
    $('closeDone').addEventListener('click', () => { done.hidden = true; done.innerHTML = ''; });
  });

  render();
})();
</script>
</body>
</html>
